name: Feature request
description: Suggest a new capability
labels: ["type: feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Keep tokens, email addresses and organization IDs out of this request. For a question, use the Discussions link on the previous page.
  - type: textarea
    id: outcome
    attributes:
      label: Description
      description: What is true now, and what should be true after.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Testable outcomes, one per line, each starting with a verb.
    validations:
      required: false
