name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Record the toolchain
        run: swift --version
      - name: Install gitleaks
        run: brew install gitleaks
      - name: Check
        run: scripts/check.sh
