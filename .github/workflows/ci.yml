name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record the toolchain
        run: swift --version
      - name: Install gitleaks
        run: brew install gitleaks
      - name: Check
        run: scripts/check.sh

  install:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the toolchain
        run: swift --version
      - name: Package the release files
        run: scripts/package-release.sh --dry-run
      - name: Install the formula from a local tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew tap-new --no-git local/ab
          mkdir -p "$(brew --repository local/ab)/Formula"
          cp build/release/agent-balancer.rb "$(brew --repository local/ab)/Formula/agent-balancer.rb"
          # Homebrew 7 refuses a formula from an untrusted tap. Older Homebrew has no brew trust.
          if brew trust --help >/dev/null 2>&1; then
            brew trust --formula local/ab/agent-balancer
          fi
          brew install local/ab/agent-balancer
      - name: Check the installed tool
        run: |
          test "$(command -v agent-balancer)" = "$(brew --prefix)/bin/agent-balancer"
          agent-balancer --version
          test -f "$(brew --prefix)/share/agent-balancer/skill/agent-balancer/SKILL.md"
          brew test local/ab/agent-balancer
          brew info local/ab/agent-balancer | grep -q 'agent-balancer uninstall'
          test ! -e "$HOME/.agent-balancer"
      - name: Remove it
        run: brew uninstall local/ab/agent-balancer
