name: Feature request
description: Suggest a new capability
labels: ["type: feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Description
      description: What is true now, and what should be true after.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Testable outcomes, one per line, each starting with a verb.
    validations:
      required: false
