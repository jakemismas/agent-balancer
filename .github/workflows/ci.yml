name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record the toolchain
        run: swift --version
      - name: Install gitleaks
        run: brew install gitleaks
      - name: Check
        run: scripts/check.sh
